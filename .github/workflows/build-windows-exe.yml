name: Build Windows EXE

# 触发方式：push 代码时自动运行，或者在 Actions 页面手动点 "Run workflow"
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest   # 关键：使用 GitHub 提供的真实 Windows 云端环境打包
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖库
        working-directory: pst_tool
        run: |
          pip install -r requirements.txt

      - name: 用 PyInstaller 打包成单文件 exe
        working-directory: pst_tool
        run: |
          pyinstaller --onefile --windowed --name "PST邮件搜索工具" --add-data "assets;assets" pst_search_tool.py

      - name: 上传打包结果
        uses: actions/upload-artifact@v4
        with:
          name: PST邮件搜索工具-windows-exe
          path: pst_tool/dist/*.exe
